name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Dashboard logic tests
        run: node crates/node/tests/dashboard_logic.js

      # Hard gates. Run `cargo fmt --all` before committing. If a new stable toolchain
      # adds a lint that breaks CI on code that has not changed, fix the lint (or add
      # `continue-on-error: true` back to the Clippy step while you do).
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build node image
        run: docker build -t quorum-node:ci .